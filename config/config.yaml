# ============================================================================
# app-pip configuration
# Edit the paths and thresholds below, then run:
#   snakemake --configfile config/config.yaml --cores 8
# ============================================================================

output_dir: "results"

# Reference build of BOTH the genome-wide genotypes and the HLA VCF: "38" or "37"
build: "38"

# Versioned reference tables (shipped in resources/)
resources:
  app_variants: "resources/app_variants_v2.tsv"
  allotype_definitions: "resources/allotype_definitions.tsv"

# Which APP genes to analyse. Leave empty ([]) to use every gene in the table.
# Grouped by the `pathway` column of the variant table.
target_genes: [
  # class I: proteasome / immunoproteasome subunits and PA28 activators
  "PSMB5", "PSMB6", "PSMB7", "PSMB8", "PSMB9", "PSMB10", "PSME1", "PSME2",
  # class I: transport, trimming and peptide loading
  "TAP1", "TAP2", "ERAP1", "ERAP2", "TAPBP", "TAPBPL", "CALR", "CANX", "PDIA3",
  # class II: processing and loading
  "CD74", "CTSS", "CTSL", "HLA-DMA", "HLA-DMB", "HLA-DOA", "HLA-DOB",
  # transcriptional regulators (class I: NLRC5; class II: CIITA)
  "NLRC5", "CIITA"]

# Optional VEP consequence filter for the SNP layer. Leave empty ([]) to keep
# all annotations. Allotype-defining sites are always extracted.
vep_annotation: []        # e.g. ["missense_variant", "synonymous_variant"]

# Genes for which allotypes are reconstructed (must have >= 2 defining
# missense residues in allotype_definitions.tsv). Leave empty ([]) for all.
allotype_genes: ["ERAP1", "ERAP2", "TAP1", "TAP2", "PSMB8", "PSMB9"]

# Minimum allotype frequency to report (0 keeps all)
allotype_min_freq: 0.0

# ---- Phased, imputed genome-wide genotypes ---------------------------------
wgs:
  # single file, or a pattern containing {chrom}
  vcf: "/path/to/wgs/chr{chrom}.phased.vcf.gz"
  chroms: [1, 5, 6, 9, 12, 14, 15, 16, 17, 19]
  snp_maf: 0.01            # minor-allele-frequency threshold
  snp_r2: 0.30             # imputation-quality threshold
  r2_info_field: "R2"      # INFO field holding imputation R^2 (e.g. R2, DR2, INFO)

# ---- HLA allele calls (imputed or molecularly typed) -----------------------
# Both 2-field and 4-field calls are used by hlafactor, so all are retained.
hla:
  vcf: "/path/to/hla.phased.vcf.gz"
  maf: 0.05
  r2: 0.80
  r2_info_field: "DR2"     # BEAGLE uses DR2; Minimac uses R2

# ---- hlafactor (HLA functional features) -----------------------------------
hlafactor:
  binary: "hlafactor"      # path to the hlafactor executable
  modules: ["het", "hetf", "exp", "sup", "tapasin", "lignk"]
