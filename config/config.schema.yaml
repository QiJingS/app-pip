$schema: "http://json-schema.org/draft-07/schema#"
description: app-pip configuration schema
type: object
properties:
  output_dir: {type: string}
  build: {type: string, enum: ["37", "38"]}
  resources:
    type: object
    properties:
      app_variants: {type: string}
      allotype_definitions: {type: string}
    required: [app_variants, allotype_definitions]
  target_genes:
    type: array
    items: {type: string}
  vep_annotation:
    type: array
    items: {type: string}
  allotype_genes:
    type: array
    items: {type: string}
  allotype_min_freq: {type: number, minimum: 0, maximum: 1}
  wgs:
    type: object
    properties:
      vcf: {type: string}
      chroms: {type: array}
      snp_maf: {type: number, minimum: 0, maximum: 0.5}
      snp_r2: {type: number, minimum: 0, maximum: 1}
      r2_info_field: {type: string}
    required: [vcf, chroms, snp_maf, snp_r2, r2_info_field]
    additionalProperties: false
  hla:
    type: object
    properties:
      vcf: {type: string}
      maf: {type: number, minimum: 0, maximum: 0.5}
      r2: {type: number, minimum: 0, maximum: 1}
      r2_info_field: {type: string}
    required: [vcf, maf, r2, r2_info_field]
    additionalProperties: false
  hlafactor:
    type: object
    properties:
      binary: {type: string}
      modules:
        type: array
        items: {type: string, enum: [het, hetf, exp, sup, tapasin, lignk, amac]}
    required: [binary, modules]
required: [output_dir, build, resources, allotype_min_freq, wgs, hla, hlafactor]
additionalProperties: false
